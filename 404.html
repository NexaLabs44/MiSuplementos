<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · MiSuplementos</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebe4d8;--bg-card:#fff;--accent:#c45e2a;--accent-light:#d9763e;--text-1:#1a0e06;--text-2:#5f4526;--text-3:#746050;
--border-mid:rgba(0,0,0,.10);--radius:10px;--radius-lg:14px;
--font-display:'Cinzel',Georgia,serif;--font-body:'Raleway','Trebuchet MS',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-body);line-height:1.65;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.box{max-width:520px;text-align:center}
.brand-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,var(--accent),var(--accent-light));display:inline-flex;align-items:center;justify-content:center;margin-bottom:22px}
h1{font-family:var(--font-display);font-size:clamp(24px,5vw,32px);font-weight:700;line-height:1.2}
p{color:var(--text-2);font-size:16.5px;margin-top:14px}
.links{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;font-weight:600;font-size:15px;padding:12px 22px;border-radius:var(--radius);text-decoration:none;border:1px solid transparent}
.btn-primary{background:linear-gradient(140deg,var(--accent),var(--accent-light));color:#fff}
.btn-ghost{border-color:var(--border-mid);color:var(--text-2);background:var(--bg-card)}
.more{margin-top:26px;font-size:14px;color:var(--text-3)}
.more a{color:var(--accent)}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="box">
  <span class="brand-icon"><svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="9" y="5" width="14" height="22" rx="7" stroke="white" stroke-width="2.2"/>
    <line x1="9" y1="16" x2="23" y2="16" stroke="white" stroke-width="2"/>
    <path d="M9 16 C9 9 12 5 16 5 C20 5 23 9 23 16Z" fill="white" fill-opacity="0.35"/>
  </svg></span>
  <h1>Esta página no existe</h1>
  <p>El enlace puede estar mal escrito o apuntar a algo que ya movimos de sitio.</p>
  <div class="links">
    <a class="btn btn-primary" href="/">Ir al inicio</a>
    <a class="btn btn-ghost" href="/app/">Entrar en la app</a>
  </div>
  <p class="more">O ve directo a las <a href="/combinaciones/">combinaciones de suplementos</a> o a los <a href="/limites/">límites máximos diarios</a>.</p>
</div>
</body>
</html>
