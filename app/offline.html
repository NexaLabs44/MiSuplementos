<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sin conexión · MiSuplementos</title>
  <meta name="theme-color" content="#c45e2a">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Trebuchet MS',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#ebe4d8;color:#2e2620;min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .box{
      background:#fff;border-radius:16px;padding:34px 28px;max-width:380px;width:100%;
      text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);
    }
    .ico{
      width:58px;height:58px;margin:0 auto 18px;border-radius:14px;
      background:linear-gradient(135deg,#c45e2a,#d9763e);
      display:flex;align-items:center;justify-content:center;font-size:26px;
    }
    h1{font-size:19px;font-weight:700;margin-bottom:9px;letter-spacing:.02em}
    p{font-size:13.5px;line-height:1.6;color:#6b625a;margin-bottom:8px}
    button{
      margin-top:18px;padding:11px 22px;border:none;border-radius:9px;
      background:#c45e2a;color:#fff;font-size:14px;font-weight:600;
      font-family:inherit;cursor:pointer;width:100%;
    }
    button:hover{filter:brightness(1.06)}
    .nota{margin-top:16px;font-size:11.5px;color:#8a7f74;line-height:1.5}
  </style>
</head>
<body>
  <main class="box">
    <div class="ico" aria-hidden="true">📡</div>
    <h1>Sin conexión</h1>
    <p>No hemos podido conectar con el servidor. Tus datos están a salvo: se cargarán en cuanto vuelvas a tener red.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <p class="nota">Si el problema continúa, comprueba tu conexión o vuelve a intentarlo en unos minutos.</p>
  </main>
  <script>
    // Recarga sola en cuanto vuelva la conexión
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
